<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhatsApp Database Generator - Prompt Genie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    label {
      display: block;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 15px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 30px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
      line-height: 1.5;
      word-break: break-all;
      max-height: 600px;
      overflow-y: auto;
    }

    /* Custom scrollbar for prompt box */
    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .step-card { padding: 25px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>WhatsApp Database Generator</h1>
    </header>

    <div class="prompt-workflow">
      
      <!-- Input Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Database Configuration</span>
          <button class="clear-btn" onclick="clearInput()">Clear</button>
        </div>
        <label for="titleInput">DB Title</label>
        <input type="text" id="titleInput" class="dynamic-input" placeholder="e.g. My Customer Database" oninput="updatePrompt()">
      </div>

      <!-- Result Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Generated HTML Code</span>
        </div>
        <div class="prompt-content" id="p1"></div>
        <button class="btn copy-btn" onclick="copyText('p1', this)">
          <span>Copy HTML Code</span>
        </button>
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const template = `<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[DB Title]</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e5ddd5;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .main-card {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #075e54;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        thead {
            background-color: #075e54;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        .wa-num {
            font-weight: bold;
            color: #25d366;
        }

        .controls {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        .btn-select { background-color: #607d8b; color: white; }
        .btn-extract { background-color: #25d366; color: white; }
        .btn-copy { background-color: #34b7f1; color: white; display: none; }

        .btn:active { transform: scale(0.98); }

        textarea {
            width: 100%;
            height: 120px;
            margin-top: 15px;
            padding: 10px;
            border: 2px solid #25d366;
            border-radius: 5px;
            display: none;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
            background: #f9f9f9;
        }

        @media screen and (max-width: 600px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr {
                border: 1px solid #ccc;
                margin-bottom: 12px;
                background: #fdfdfd;
                border-radius: 8px;
                padding: 5px 0;
            }
            td {
                border: none;
                border-bottom: 1px solid #eee;
                position: relative;
                padding-left: 45% !important;
                text-align: right;
                min-height: 25px;
            }
            td:last-child { border-bottom: none; }
            td:before {
                position: absolute;
                left: 10px;
                width: 40%;
                font-weight: bold;
                text-align: left;
                content: attr(data-label);
                color: #075e54;
            }
        }
    </style>
</head>
<body>

<div class="main-card">
    <h2>[DB Title]</h2>

    <table id="myTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Notes</th>
                <th>WhatsApp Number</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td data-label="Name"><input type="checkbox" class="row-check"> asdf</td>
                <td data-label="Notes">Client A</td>
                <td data-label="WhatsApp Number" class="num-val">1234567890</td>
            </tr>
        </tbody>
    </table>

    <div class="controls">
        <button id="selectAllBtn" class="btn btn-select" onclick="toggleSelectAll()">Select All</button>
        <button class="btn btn-extract" onclick="doExtract()">Extract Selected</button>
        <textarea id="resultArea" readonly placeholder="এক্সট্রাক্ট করা নাম্বারগুলো এখানে আসবে..."></textarea>
        <button id="copyBtn" class="btn btn-copy" onclick="doCopy()">Copy Database</button>
    </div>
</div>

<script>
    let allSelected = false;

    function toggleSelectAll() {
        const boxes = document.querySelectorAll('.row-check');
        const btn = document.getElementById('selectAllBtn');
        allSelected = !allSelected;
        boxes.forEach(box => { box.checked = allSelected; });
        btn.innerText = allSelected ? "Deselect All" : "Select All";
        btn.style.backgroundColor = allSelected ? "#e91e63" : "#607d8b";
    }

    function doExtract() {
        const boxes = document.querySelectorAll('.row-check');
        const resArea = document.getElementById('resultArea');
        const copyBtn = document.getElementById('copyBtn');
        let selected = [];
        boxes.forEach((box) => {
            if (box.checked) {
                const row = box.closest('tr');
                const num = row.querySelector('.num-val').innerText.trim();
                selected.push(num);
            }
        });
        if (selected.length > 0) {
            resArea.value = selected.join('\\n');
            resArea.style.display = 'block';
            copyBtn.style.display = 'block';
            resArea.scrollIntoView({ behavior: 'smooth' });
        } else {
            alert("দয়া করে অন্তত একটি নাম্বার সিলেক্ট করুন!");
            resArea.style.display = 'none';
            copyBtn.style.display = 'none';
        }
    }

    function doCopy() {
        const area = document.getElementById('resultArea');
        area.select();
        navigator.clipboard.writeText(area.value).then(() => {
            const btn = document.getElementById('copyBtn');
            const originalText = btn.innerText;
            btn.innerText = "✓ Copied!";
            btn.style.backgroundColor = "#075e54";
            setTimeout(() => { 
                btn.innerText = originalText; 
                btn.style.backgroundColor = "#34b7f1";
            }, 2000);
        });
    }
<\/script>

</body>
</html>`;

    function updatePrompt() {
      const userInput = document.getElementById('titleInput').value.trim() || "[DB Title]";
      // Use split/join to globally replace all occurrences of [DB Title]
      const finalPrompt = template.split("[DB Title]").join(userInput);
      document.getElementById('p1').innerText = finalPrompt;
    }

    function clearInput() {
      document.getElementById('titleInput').value = "";
      updatePrompt();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize display on load
    window.onload = updatePrompt;
  </script>
</body>
</html>
